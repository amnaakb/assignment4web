
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserve a Café Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container py-5">
  <section class="form-card mx-auto">
    <header class="form-card-header">
      <h1 class="h3 mb-1">Reserve a table</h1>
      <p class="mb-0">Tell us about your visit</p>
    </header>

    <form action="#" method="get">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label" for="guestName">Your name</label>
          <input class="form-control" id="guestName" name="guestName"
                 type="text" autocomplete="name" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="guestEmail">Email</label>
          <input class="form-control" id="guestEmail" name="guestEmail"
                 type="email" autocomplete="email" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="guestPhone">Phone</label>
          <input class="form-control" id="guestPhone" name="guestPhone"
                 type="tel" autocomplete="tel" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="guests">Guests</label>
          <input class="form-control" id="guests" name="guests"
                 type="number" min="1" max="20" step="1" value="2" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="date">Date</label>
          <input class="form-control" id="date" name="date"
                 type="date" required>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="meal">Meal</label>
          <select class="form-select" id="meal" name="meal" required>
            <option value="" selected disabled>Choose a time</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>

        <fieldset class="col-12">
          <legend class="form-label">Seating area</legend>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" id="inside" name="seating"
                     type="radio" value="inside" checked>
              <label class="form-check-label" for="inside">Inside</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" id="terrace" name="seating"
                     type="radio" value="terrace">
              <label class="form-check-label" for="terrace">Terrace</label>
            </div>
          </div>
        </fieldset>

        <div class="col-12">
          <label class="form-label" for="comments">Comments (optional)</label>
          <textarea class="form-control" id="comments" name="comments"
                    rows="3" placeholder="Any special requests?"></textarea>
        </div>

        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" id="terms" name="terms"
                   type="checkbox" value="accepted" required>
            <label class="form-check-label" for="terms">
              I agree to the reservation terms
            </label>
          </div>
        </div>

        <div class="col-12">
          <button class="btn btn-primary w-100" type="submit">
            Reserve table
          </button>
        </div>
      </div>
    </form>
  </section>
</main>
</body>
</html>
