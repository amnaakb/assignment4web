
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Train Ticket</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ticket-page">
<main class="container py-4 py-lg-5">
  <div class="ticket-shell mx-auto">
    <header class="ticket-header">
      <h1 class="h5 mb-0">Book a train ticket</h1>
    </header>

    <form class="ticket-form" action="#" method="get">
      <fieldset class="mb-4">
        <legend class="visually-hidden">Trip type</legend>
        <div class="trip-toggle">
          <input class="btn-check" type="radio" name="tripType"
                 id="oneWay" value="one-way" checked>
          <label class="btn" for="oneWay">One way</label>

          <input class="btn-check" type="radio" name="tripType"
                 id="roundTrip" value="round-trip">
          <label class="btn" for="roundTrip">Round trip</label>
        </div>
      </fieldset>

      <div class="row g-3 mb-3">
        <div class="col-12 col-md-6">
          <label for="from" class="form-label visually-hidden">From</label>
          <input class="form-control" id="from" name="from"
                 type="text" placeholder="From" value="Astana" required>
        </div>
        <div class="col-12 col-md-6">
          <label for="to" class="form-label visually-hidden">To</label>
          <input class="form-control" id="to" name="to"
                 type="text" placeholder="To" value="Almaty" required>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-12 col-md-4">
          <label for="departure" class="form-label">Departure</label>
          <input class="form-control" id="departure" name="departure"
                 type="date" required>
        </div>
        <div class="col-12 col-md-4">
          <label for="return" class="form-label">Return</label>
          <input class="form-control" id="return" name="return" type="date">
        </div>
        <div class="col-12 col-md-4">
          <label for="passengers" class="form-label">Passengers</label>
          <select class="form-select" id="passengers" name="passengers">
            <option value="1" selected>1 adult</option>
            <option value="2">2 adults</option>
            <option value="3">3 adults</option>
            <option value="4">4 adults</option>
            <option value="5">5 adults</option>
            <option value="6">6 adults</option>
          </select>
        </div>
      </div>

      <fieldset class="mb-3">
        <legend class="form-label">Carriage class</legend>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check">
            <input class="form-check-input" id="seat" name="class"
                   type="radio" value="seat">
            <label class="form-check-label" for="seat">Seat</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="coupe" name="class"
                   type="radio" value="coupe" checked>
            <label class="form-check-label" for="coupe">Coupé</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="sleeper" name="class"
                   type="radio" value="sleeper">
            <label class="form-check-label" for="sleeper">Sleeper</label>
          </div>
        </div>
      </fieldset>

      <div class="row g-3 mb-3">
        <div class="col-12 col-md-6">
          <label for="phone" class="form-label">Phone</label>
          <div class="input-group">
            <span class="input-group-text">+7</span>
            <input class="form-control" id="phone" name="phone"
                   type="tel" placeholder="701 234 56 78" required>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <label for="email" class="form-label">Email</label>
          <input class="form-control" id="email" name="email"
                 type="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-check mb-2">
        <input class="form-check-input" id="sms" name="sms" type="checkbox">
        <label class="form-check-label" for="sms">
          Also send the ticket by SMS
        </label>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" id="agreement" name="agreement"
               type="checkbox" required>
        <label class="form-check-label" for="agreement">
          I agree with the carriage rules
        </label>
      </div>

      <div class="ticket-actions d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
        <button class="btn btn-clear" type="reset">Clear</button>
        <button class="btn btn-find" type="submit">Find trains</button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
